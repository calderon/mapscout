name: Package

# Builds MapScout-vX.Y.Z.zip for a release tag and attaches it to the GitHub release.
# It also uploads it to CurseForge once the project exists: the packager only uploads
# when MapScout.toc has "## X-Curse-Project-ID" and the CF_API_KEY secret is set
# (both added with the 1.0, #89); until then that step is skipped without failing.
# - Called by the release workflow when release-please creates a release (#15).
# - Can be run by hand from the Actions tab ("Run workflow") to publish or retry a tag.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      CF_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a release tag: $TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      # BigWigs Packager run directly (not as an action): started from a push to main,
      # the action refuses to package a commit that has a tag ("Found future tag"),
      # expecting a later run for the tag that never happens with release-please.
      - name: Build the zip (and upload it to CurseForge when configured)
        run: |
          curl -fsSL https://raw.githubusercontent.com/BigWigsMods/packager/v2/release.sh -o "$RUNNER_TEMP/release.sh"
          GITHUB_EVENT_NAME=release bash "$RUNNER_TEMP/release.sh" -n "{package-name}-{project-version}:{project-version}"
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}

      - name: Attach the zip to the GitHub release
        run: gh release upload "$TAG" .release/*.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
