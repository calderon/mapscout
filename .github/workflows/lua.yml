name: Lua

# Compiles every addon .lua file with LuaJIT (the game's Lua 5.1) and checks
# for undefined globals with luacheck. Same script as locally:
# bash scripts/check-lua.sh
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install LuaJIT and luacheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit luarocks
          sudo luarocks install luacheck
      - name: Check Lua files
        run: bash scripts/check-lua.sh
